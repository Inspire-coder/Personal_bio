<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Objects</title>
</head>

<body>
  <script type="text/javascript" charset="utf-8">
   // 1. Create a Task Object
let task = {
  id: 1,
  name: "Practice objects and conditionals",
  completed: true
};

// 2. Check Task Status
if (task.completed) {
  console.log("✅ Task is completed!");
} 
else {
  console.log("❌ Task is still pending…");
}
  </script>
</body>

</html>
